name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gpwidget:
    # gtk4-layer-shell is not packaged on Ubuntu 24.04. The pinned
    # actionlint learns this hosted label from .github/actionlint.yaml.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libgnutls28-dev

      - name: Test the Omarchy widget model
        run: node apps/gpwidget/assets/omarchy/Model.test.js

      - name: Test gpwidget
        run: cargo test -p gpwidget --locked
